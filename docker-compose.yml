services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_data_warehouse
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./datasets:/datasets
      - ./scripts:/scripts
      - ./tests:/tests
      - ./scripts/init_database.sql:/init_database.sql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped


  sql_init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_dw_init
    user: root
    environment:
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    volumes:
      - ./datasets:/datasets
      - ./scripts:/scripts
      - ./tests:/tests
      - ./scripts/init_database.sql:/init_database.sql
      - ./orchestration:/orchestration
    depends_on:
      sqlserver:
        condition: service_healthy
    command: bash /orchestration/run_sql_pipeline.sh
    restart: "no"

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt_dw
    volumes:
      - ./dbt_dw:/usr/app
    working_dir: /usr/app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DBT_PROFILES_DIR: /usr/app
    command: tail -f /dev/null
    restart: "no"

volumes:
  sqlserver_data: