services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_data_warehouse
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./datasets:/datasets
      - ./scripts:/scripts
      - ./tests:/tests
      - ./scripts/init_database.sql:/init_database.sql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - dw_network

  sql_init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_dw_init
    user: root
    environment:
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    volumes:
      - ./datasets:/datasets
      - ./scripts:/scripts
      - ./tests:/tests
      - ./scripts/init_database.sql:/init_database.sql
      - ./orchestration:/orchestration
    depends_on:
      sqlserver:
        condition: service_healthy
    command: bash /orchestration/run_sql_pipeline.sh
    restart: "no"
    networks:
      - dw_network

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt_dw
    volumes:
      - ./dbt_dw:/usr/app
    working_dir: /usr/app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DBT_PROFILES_DIR: /usr/app
    command: tail -f /dev/null
    restart: "no"
    networks:
      - dw_network

  airflow:
    build:
      context: .
      dockerfile: orchestration/Dockerfile.airflow
    container_name: airflow_dw
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: "sql-data-warehouse-airflow"
      DBT_PROFILES_DIR: /opt/airflow/dbt_dw
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration/logs:/opt/airflow/logs
      - ./orchestration/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./datasets:/datasets
      - ./dbt_dw:/opt/airflow/dbt_dw
    working_dir: /opt/airflow
    depends_on:
      sqlserver:
        condition: service_healthy
      dbt:
        condition: service_started
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true;
      airflow scheduler &
      airflow webserver --port 8080
      "
    restart: unless-stopped
    networks:
      - dw_network

volumes:
  sqlserver_data:

networks:
  dw_network:
    driver: bridge